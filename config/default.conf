# =============================================================================
# agent-tmux-bridge -- Default Configuration
# =============================================================================
# Override any value in ~/.config/agent-tmux-bridge/bridge.conf
# or via environment variable BRIDGE_<UPPERCASED_KEY>
# =============================================================================

# --- Session ---
SESSION_NAME=""               # Empty = auto-generate bridge-<uuid>
TMUX_SESSION_NAME=""          # Explicit session name (overrides auto-gen)

# --- Layout ---
LAYOUT="horizontal"           # horizontal | vertical
USER_PANE_SIZE="60"           # percentage
AGENT_PANE_SIZE="40"          # percentage

# --- Shells ---
USER_SHELL=""                 # Empty = auto-detect from $SHELL
AGENT_SHELL=""                # Empty = auto-detect from $SHELL

# --- Activity Detection ---
COOLDOWN_SECONDS="5"          # How long after user typing is block active
POLL_INTERVAL_MS="200"        # Daemon polling interval in milliseconds
ACTIVITY_DETECTION="auto"     # auto | cursor_only | prompt_only

# --- Validator (external safety mechanism) ---
# The validator is an EXTERNAL executable that independently approves or
# rejects commands. It is NOT the AI agent self-checking — that would be
# unreliable since models can be wrong and non-Anthropic APIs may be used.
#
# VALIDATOR CONTRACT (return 0 = ALLOW, non-0 = REJECT):
#   - STDOUT on success: optionally modified command (or empty = keep original)
#   - STDERR on failure: rejection reason
#
# THREE MODES (auto-detected):
#
#   1. const mode (no "{}" in string):
#      Executed as-is, no stdin, no arguments. Does NOT see the command.
#      Purely exit-code based: 0 = allow, non-0 = reject.
#      Examples:
#        VALIDATOR="true"          → always allow (simplest allow-all)
#        VALIDATOR="false"         → always reject (simplest block-all)
#        VALIDATOR="./coinflip.sh" → random allow/reject
#        VALIDATOR="./my-check.sh" → custom logic, no command inspection
#
#   2. template mode (string contains "{}"):
#      "{}" is replaced with the shell-escaped command text.
#      The validator receives the command and can inspect/modify it.
#      Examples:
#        VALIDATOR="./check.py --input {}"
#        VALIDATOR="./config/sanitizers/reject-dangerous.sh {}"
#        VALIDATOR="./config/sanitizers/require-confirm.sh {}"
#
#   3. stdin mode (string starts with "stdin:"):
#      Legacy mode — command is piped to validator's STDIN.
#      Example: VALIDATOR="stdin:./legacy-validator.sh"
#
# Built-in options:
#   true / false                        — const: always allow / always reject
#   config/sanitizers/allow-all.sh {}   — template: pass-through
#   config/sanitizers/block-all.sh {}   — template: reject everything
#   config/sanitizers/reject-dangerous.sh {} — template: block dangerous patterns
#   config/sanitizers/validator.py --input {} — Python validator (template mode)
VALIDATOR=""                   # Empty = no validator (allow all)
VALIDATOR_TIMEOUT="5"          # Seconds before killing hung validator

# Backward compatibility: SANITIZER is an alias for VALIDATOR
SANITIZER="${VALIDATOR}"
SANITIZER_TIMEOUT="${VALIDATOR_TIMEOUT}"

# --- Logging ---
LOG_LEVEL="info"              # debug | info | warn | error
LOG_FILE=""                   # Empty = log to <run_dir>/log/
LOG_MAX_SIZE="10485760"       # 10MB max per log file
LOG_MAX_FILES="3"             # Number of rotated logs to keep

# --- Buffer Reading ---
READ_MAX_LINES="10000"        # Max lines returned by bridge read
STRIP_ANSI="true"             # Strip ANSI escape codes from output
STRIP_OSC="true"              # Strip OSC sequences (hyperlinks, etc.)

# --- Injection ---
INTERACTIVE_MODE="true"       # true = user must press Enter (human-in-the-loop)
                              # false = auto-press Enter after typing command
INJECTION_DELAY_MS="0"        # Delay between keystrokes during injection (0 = instant)
BLOCK_ON_COPY_MODE="true"     # Block injection when user is in tmux copy mode
BLOCK_ON_ALTERNATE_SCREEN="true"  # Block injection when user is in vim/less/etc.

# --- Paths (set by bridge-init at runtime) ---
BRIDGE_HOME="/home/illia/Projects/agent-tmux-bridge"
BRIDGE_RUN_DIR=""             # Set at runtime: /tmp/bridge/<session-name>/
BRIDGE_SESSION=""             # Set at runtime
BRIDGE_USER_PANE=""           # Set at runtime
BRIDGE_AGENT_PANE=""          # Set at runtime
